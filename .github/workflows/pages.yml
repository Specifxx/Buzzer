# Build and deploy Buzzer Studio (the public gallery + designer) to
# GitHub Pages via the classic gh-pages branch. The catalogue is
# generated by the real pipeline at build time; the browser renderer is
# cross-checked against the Python content firewall before deploying.
#
# Creating the gh-pages branch auto-enables Pages on most repos. If the
# site does not appear, enable once: Settings -> Pages -> Source:
# "Deploy from a branch" -> Branch: gh-pages.

name: pages

on:
  push:
    branches: [claude/compassionate-lovelace-cwnh8c, main, master]
    paths:
      - "site/**"
      - "scripts/**"
      - "src/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --frozen

      - name: Generate the catalogue with the real pipeline
        run: uv run python scripts/build_site_catalogue.py site 36

      - name: Cross-check the browser renderer against the content firewall
        run: |
          node scripts/check_js_render.mjs /tmp/js_render_check
          uv run python scripts/validate_js_render.py /tmp/js_render_check

      - name: Publish to the gh-pages branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd site
          touch .nojekyll
          git init -b gh-pages
          git config user.name "buzzer-pages-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "deploy buzzer studio from ${GITHUB_SHA::8}"
          git push --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages

      - name: Upload downloadable copy (works without Pages)
        uses: actions/upload-artifact@v4
        with:
          name: buzzer-studio-site
          path: site
          retention-days: 30
