# Build and deploy Buzzer Studio (the public gallery + designer) to
# GitHub Pages. The catalogue is generated by the real pipeline at build
# time; the browser renderer is cross-checked against the Python content
# firewall before anything deploys.

name: pages

on:
  push:
    branches: [claude/compassionate-lovelace-cwnh8c, main, master]
    paths:
      - "site/**"
      - "scripts/**"
      - "src/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --frozen

      - name: Generate the catalogue with the real pipeline
        run: uv run python scripts/build_site_catalogue.py site 36

      - name: Cross-check the browser renderer against the content firewall
        run: |
          node scripts/check_js_render.mjs /tmp/js_render_check
          uv run python scripts/validate_js_render.py /tmp/js_render_check

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Upload downloadable copy (works without Pages)
        uses: actions/upload-artifact@v4
        with:
          name: buzzer-studio-site
          path: site
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
