# Test suite, type check and lint on every push and PR.
# Fully offline: tests use generated fixtures, never stats.nba.com.

name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install system cairo (for cairosvg)
        run: sudo apt-get update -q && sudo apt-get install -y -q libcairo2

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check && uv run ruff format --check

      - name: Type check
        run: uv run mypy

      - name: Tests
        run: uv run pytest -q
