[project]
name = "buzzer"
version = "0.1.0"
description = "Automated print-on-demand posters of iconic basketball moments, rendered as original minimalist data-art."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "nba_api>=1.4",
    "click>=8.1",
    "jinja2>=3.1.6",
    "cairosvg>=2.9.0",
    "pillow>=12.2.0",
]

[project.scripts]
buzzer = "buzzer.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "mypy>=1.10",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/buzzer"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["nba_api.*", "cairosvg.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
